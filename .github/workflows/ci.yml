name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build and Test
    # ubuntu-26.04 (ubuntu-latest since 2026-11) cannot build jaro_winkler 1.5.6,
    # pulled in by the generated Gemfile's rubocop 0.66: unknown type name 'bool'.
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: false

      - name: Install dependencies
        run: bundle install

      - name: Run tests
        run: bundle exec rake spec
